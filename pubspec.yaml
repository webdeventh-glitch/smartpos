name: desktop_starter
description: Offline point of sale and inventory workspace with local SQLite storage.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  intl: ^0.20.3
  fl_chart: ^1.2.0
  crypto: ^3.0.6
  http: ^1.6.0
  mysql_client: ^0.0.27
  mysql_client_plus: ^0.1.3
  font_awesome_flutter: ^11.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
